# This file forms part of the configuration of the vaping-duty service.
# For details of how the configuration is specified for each environment, see:
# https://github.com/hmrc/app-config-base/blob/main/documentation/README.md

include "backend.conf"

# This is the main configuration file for the application.
# ~~~~~

appName = vaping-duty

# Default http client
play.modules.enabled += "uk.gov.hmrc.play.bootstrap.HttpClientV2Module"

# Json error handler
play.http.errorHandler = "uk.gov.hmrc.play.bootstrap.backend.http.JsonErrorHandler"

# Play Modules
play.modules.enabled += "uk.gov.hmrc.vapingduty.Module"

play.modules.enabled += "uk.gov.hmrc.mongo.play.PlayMongoModule"

play.modules.enabled += "uk.gov.hmrc.play.bootstrap.AuthModule"

# The application languages
# ~~~~~
play.i18n.langs = ["en"]

# Router
# ~~~~~
# Define the Router object to use for this application.
# This router will be looked up first when the application is starting up,
# so make sure this is the entry point.
# Furthermore, it's assumed your route file is named properly.
# So for an application router like `my.application.Router`,
# you may need to define a router file `conf/my.application.routes`.
# Default to Routes in the root package (and conf/routes)
# !!!WARNING!!! DO NOT CHANGE THIS ROUTER
play.http.router = prod.Routes

# Microservice specific config

mongodb {
  uri        = "mongodb://localhost:27017/vaping-duty"
  timeToLive = 30days
  
  nrs-work-item {
    ttl = 7 days
    retry-after = 10 minutes
    max-retries = 10
    exponential-backoff-factor = 2.0
  }
}

microservice {
  services {
    auth {
      host = localhost
      port = 8500
    }
    submit-return {
      protocol = http
      host = localhost
      port = 8142
      clientId = "client id"
      secret   = "override-me!"
      url.submitReturn = "/etmp/RESTAdapter/vpd/returns"
    }

    obligations {
      protocol = http
      host     = localhost
      port     = 8142
      clientId = "client id"
      secret   = "override-me!"
      url      = "/etmp/RESTAdapter/cross-regime/taxpayer-obligations"
    }

    nrs {
      protocol = http
      host     = localhost
      port     = 9389
      url      = "/submission"
      api-key  = "test-api-key"
      
      max-failures = 5
      call-timeout = 30 seconds
      reset-timeout = 60 seconds
      max-reset-timeout = 300 seconds
      exponential-backoff-factor = 2.0
    }
  }
}

enrolment {
  serviceName = "HMRC-VPD-ORG"
  identifierKey = "ZVPD"
}

features {
  nrs-submission-enabled = true
  nrs-generation-enabled = true
}

nrs-submission-scheduler {
  enabled = true
  interval = 30 seconds
  initial-delay = 1 minute
}

# NRS Circuit Breaker Configuration
# Uses Pekko's built-in CircuitBreaker with exponential backoff
# Configuration values:
#   - max-failures: Number of failures before opening the circuit (default: 5)
#   - call-timeout: Maximum time to wait for a call to complete (default: 30 seconds)
#   - reset-timeout: Initial time to wait before attempting to close the circuit (default: 60 seconds)
#   - max-reset-timeout: Maximum reset timeout with exponential backoff (default: 300 seconds)
#   - exponential-backoff-factor: Multiplier for exponential backoff (default: 2.0)
